<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI &amp; Science — Live Feed</title>
<meta name="description" content="Categorized AI & science research, scored daily." />
<meta name="theme-color" content="#0f1115" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml" />
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="AI Feed" />
<link rel="stylesheet" href="fonts/montserrat.css?v=2" />
<link rel="stylesheet" href="styles.css?v=20" />
</head>
<body>
  <div class="app">
    <div class="scrim" id="scrim"></div>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <h1>AI &amp; Science</h1>
        <span class="brand-sub">Live research feed</span>
      </div>

      <nav class="nav" id="nav" aria-label="Sources"></nav>

      <section class="following">
        <div class="following-head">
          <h2>Following</h2>
          <button id="catAll" type="button" class="linkbtn">All</button>
        </div>
        <p class="profile-hint">Pick categories to show on Home.</p>
        <div id="categoryChips" class="chips"></div>

        <details class="ai-settings">
          <summary>Notion sync</summary>
          <div class="ai-settings-body">
            <input id="pNotionUrl" class="profile-input" type="url" placeholder="Apps Script /exec or Worker URL" />
            <button id="saveNotionUrl" type="button">Save webhook URL</button>
            <span id="notionUrlMsg" class="profile-msg" aria-live="polite"></span>
          </div>
        </details>
      </section>

      <button id="refreshBtn" class="refresh" type="button">↻ Refresh now</button>
    </aside>

    <main class="content">
      <header class="content-head">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu">☰</button>
        <button class="head-icon" id="homeBtn" type="button" aria-label="Home" title="Home">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg>
        </button>
        <button class="head-icon" id="lbBtn" type="button" aria-label="Leaderboard" title="Leaderboard">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4"/><path d="M4 20h16"/><rect x="7" y="11" width="3" height="6" rx="0.5"/><rect x="12" y="7" width="3" height="10" rx="0.5"/><rect x="17" y="4" width="3" height="13" rx="0.5"/></svg>
        </button>
        <h2 id="sectionTitle">Home</h2>
        <span id="meta" class="meta" aria-live="polite"></span>
        <div class="fs-controls" aria-label="Text size">
          <button id="fsDown" type="button" aria-label="Smaller text">A−</button>
          <button id="fsUp" type="button" aria-label="Larger text">A+</button>
        </div>
      </header>
      <div id="feed" class="feed" aria-live="polite"></div>
      <div id="deckDots" class="deck-dots" aria-hidden="true"></div>
    </main>
  </div>

  <script src="feed.js?v=20"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
