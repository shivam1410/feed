<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI &amp; Science — Live Feed</title>
<meta name="description" content="Categorized AI & science research, scored daily." />
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="assets/icon.svg?v=2" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="AI Feed" />
<link rel="stylesheet" href="fonts/montserrat.css?v=2" />
<link rel="stylesheet" href="styles.css?v=59" />
</head>
<body>
  <div class="app">
    <div class="scrim" id="scrim"></div>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <button id="closeNav" class="close-nav" type="button" aria-label="Close menu">✕</button>
        <h1>AI &amp; Science</h1>
        <span class="brand-sub">Live research feed</span>
      </div>

      <div class="fs-controls" aria-label="Text size">
        <span class="fs-label">Text size</span>
        <button id="fsDown" type="button" aria-label="Smaller text">A−</button>
        <button id="fsUp" type="button" aria-label="Larger text">A+</button>
      </div>

      <nav class="nav" id="nav" aria-label="Sources"></nav>

      <section class="following">
        <div class="following-head">
          <h2>Topics</h2>
          <button id="catAll" type="button" class="linkbtn">All</button>
        </div>
        <p class="profile-hint">Pick categories to show on Home.</p>
        <div id="categoryChips" class="chips"></div>

        <details class="ai-settings">
          <summary>Notion sync</summary>
          <div class="ai-settings-body">
            <input id="pNotionUrl" class="profile-input" type="url" placeholder="Apps Script /exec or Worker URL" />
            <button id="saveNotionUrl" type="button">Save webhook URL</button>
            <span id="notionUrlMsg" class="profile-msg" aria-live="polite"></span>
          </div>
        </details>

        <details class="ai-settings">
          <summary>Read aloud</summary>
          <div class="ai-settings-body">
            <label class="tts-label" for="voiceSelect">Voice</label>
            <select id="voiceSelect" class="profile-input"></select>
            <label class="tts-label" for="rateRange">Speed <span id="rateVal">1.0×</span></label>
            <input id="rateRange" class="tts-range" type="range" min="0.6" max="1.8" step="0.1" value="1" />
          </div>
        </details>
      </section>

    </aside>

    <main class="content">
      <header class="content-head">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu">☰</button>
        <nav id="tabbar" class="tabbar" aria-label="Feeds"></nav>
        <button class="head-icon" id="lbBtn" type="button" aria-label="Leaderboard" title="Leaderboard"></button>
        <h2 id="sectionTitle" hidden></h2>
        <span id="meta" class="meta" hidden aria-live="polite"></span>
      </header>
      <div id="feed" class="feed" aria-live="polite"></div>
      <div id="deckDots" class="deck-dots" aria-hidden="true"></div>
    </main>
  </div>

  <script src="feed.js?v=59"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
